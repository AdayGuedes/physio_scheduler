
{% extends "base.html" %}

{% block title %}Login | Physio Scheduler{% endblock %}

{% block content %}

<div class="login-wrapper">

  <div class="login-logo-u">
    <img
      src="{{ url_for('static', filename='images/union-logo-U.png') }}"
      alt="Union Commonwealth University logo"
    />
  </div>

  <div class="login-card">

    <h1>Welcome Back</h1>

    <p class="text-muted text-center mb-4">
      Sign in to your Physio Scheduler account.
    </p>

    {% if errors %}
      <div class="login-errors" role="alert">
        {% for error in errors %}
          <p>{{ error }}</p>
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

      <div>
        <label for="email" class="form-label">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          placeholder="email@unionky.edu"
          autocomplete="email"
          required
        />
      </div>

      <div>
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary w-100">
        Sign In
      </button>

    </form>

  </div>

</div>

{% endblock %}
