<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

 <link rel="stylesheet" href="../../static/css/style.css">

  <title>Login</title>
</head>

<body>

  <div class="divpai">

    <div class="logo">
      <img
        src="https://irp.cdn-website.com/62fe7d2a/files/uploaded/Main_orange-bf00be67.png"
        alt="Union College logo"
      >
    </div>

    <div class="divfilho">

      <h1>Login</h1>

      <form method="POST" action="{{ url_for('auth.login') }}">

        <input
          type="text"
          name="email"
          placeholder="email@unionky.edu"
          required
        >

        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        >

        <button type="submit" class="b3">
          Continue
        </button>

      </form>

    </div>

  </div>

</body>

</html>
