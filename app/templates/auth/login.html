{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block navbar %}
{% endblock %}

{% block content %}

<div class="login-wrapper">

    <div class="logo">
        <img
            src="{{ url_for('static', filename='images/union-logo-U.png') }}"
            alt="Union College logo"
        />
    </div>

    <div class="login-card">

        <h1>Login</h1>

        {% if errors %}
        <div class="login-errors">
            {% for error in errors %}
            <p>{{ error }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.login') }}">

            <input
                type="email"
                name="email"
                placeholder="email@unionky.edu"
                required
            />

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            />

            <button
                type="submit"
                class="btn-primary-custom"
            >
                Continue
            </button>

        </form>

    </div>

</div>

{% endblock %}
