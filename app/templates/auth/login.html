{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}

<div class="divpai">

    <div class="logo">
        <img
            src="https://irp.cdn-website.com/62fe7d2a/files/uploaded/Main_orange-bf00be67.png"
            alt="Union College logo"
        >
    </div>

    <div class="divfilho">

        <h1>Login</h1>

        {% if errors %}
            <div class="login-errors">
                {% for error in errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.login') }}">

            <input
                type="email"
                name="email"
                placeholder="email@unionky.edu"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit" class="b3">
                Continue
            </button>

        </form>

    </div>

</div>

{% endblock %}
