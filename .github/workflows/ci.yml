name: CI

on: 
  pull_request:
    branches: [main]

permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-key
      DATABASE_URL: sqlite:///ci.db
    steps:
      - name: Get-code-changes
        uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r requirements-dev.txt

      - name: Check migrations match models
        run: |
          flask db upgrade
          flask db check
      - name: Run format script
        run: ./scripts/format.sh --check
      - name: Run lint script
        run: ./scripts/lint.sh
      - name: Run tests
        run: ./scripts/test.sh

  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Get-code-changes
        uses: actions/checkout@v5
      - name: Claude PR review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as a senior developer would. Focus on:
            - Correctness and potential bugs
            - Security issues
            - Code quality and maintainability
            - Whether tests adequately cover the change

            Use `gh pr comment` for top-level, overall feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            to flag specific lines. Only post GitHub comments — do not just reply as text.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"